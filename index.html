function formatAmount(amount) {
  const fractions = [
    [0.25, "¼"], [0.33, "⅓"], [0.5, "½"], [0.66, "⅔"], [0.75, "¾"],
    [0.125, "⅛"], [0.375, "⅜"], [0.625, "⅝"], [0.875, "⅞"],
  ];
  const whole = Math.floor(amount);
  const decimal = amount - whole;
  if (decimal < 0.05) return `${whole}`;
  for (const [val, frac] of fractions) {
    if (Math.abs(decimal - val) < 0.05) {
      return whole > 0 ? `${whole} ${frac}` : frac;
    }
  }
  return amount % 1 === 0 ? `${amount}` : `${parseFloat(amount.toFixed(2))}`;
}

function Timer({ seconds }) {
  const [remaining, setRemaining] = useState(seconds);
  const [running, setRunning] = useState(false);
  const [finished, setFinished] = useState(false);

  useEffect(() => {
    if (!running || remaining <= 0) {
      if (running && remaining <= 0) {
        setRunning(false);
        setFinished(true);
      }
      return;
    }
    const interval = setInterval(() => setRemaining((r) => r - 1), 1000);
    return () => clearInterval(interval);
  }, [running, remaining]);

  const mins = Math.floor(remaining / 60);
  const secs = remaining % 60;

  const reset = () => { setRemaining(seconds); setRunning(false); setFinished(false); };

  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 10, marginTop: 10,
      background: finished ? "#FEF3C7" : "#F5F0E8", borderRadius: 12, padding: "8px 14px",
    }}>
      <span style={{ fontSize: 13, color: "#92400E", fontWeight: 600 }}>
        {finished ? "⏰ Done!" : `⏱ ${mins}:${secs.toString().padStart(2, "0")}`}
      </span>
      <div style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
        {!finished && (
          <button onClick={() => setRunning(!running)} style={{
            background: running ? "#DC2626" : "#16A34A", color: "#fff", border: "none",
            borderRadius: 8, padding: "5px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer",
          }}>
            {running ? "Pause" : remaining < seconds ? "Resume" : "Start"}
          </button>
        )}
        <button onClick={reset} style={{
          background: "#E5E0D8", color: "#44403C", border: "none",
          borderRadius: 8, padding: "5px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer",
        }}>
          Reset
        </button>
      </div>
    </div>
  );
}

            display: "inline-block", marginTop: 8, fontSize: 12, fontWeight: 600,
            color: "#BBF7D0", background: "rgba(255,255,255,0.12)",

          }}>
            🔥 {recipe.calories}
          </span>
        )}
        <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 13, margin: "6px 0 0", lineHeight: 1.4 }}>
          {recipe.description}
        </p>
      </div>

          <span style={{ fontSize: 13, fontWeight: 600, color: "#78716C" }}>Servings</span>
          <button onClick={() => setServings(Math.max(1, servings - 1))} style={{
            width: 36, height: 36, borderRadius: "50%", border: "none",
            background: "#E5E0D8", fontSize: 18, fontWeight: 700, cursor: "pointer", color: "#44403C",
          }}>−</button>
          <span style={{ fontSize: 24, fontWeight: 700, color: "#3B1F0B", minWidth: 30, textAlign: "center" }}>
            {servings}
          </span>
          <button onClick={() => setServings(servings + 1)} style={{
            width: 36, height: 36, borderRadius: "50%", border: "none",
            background: "#3B1F0B", fontSize: 18, fontWeight: 700, cursor: "pointer", color: "#fff",
          }}>+</button>
        </div>

        {/* Ingredients */}
        <h2 style={{ fontSize: 17, fontWeight: 700, color: "#3B1F0B", margin: "24px 0 12px" }}>Ingredients</h2>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {recipe.ingredients.map((ing, i) => (
            <div key={i} style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "10px 14px", background: "#fff", borderRadius: 10,
              border: "1px solid #EDE8DF",
            }}>
              <span style={{ fontSize: 14, color: "#44403C", flex: 1 }}>{ing.name}</span>
              <span style={{ fontSize: 14, fontWeight: 700, color: "#3B1F0B", whiteSpace: "nowrap", marginLeft: 12 }}>
                {formatAmount(ing.amount * scale)} {ing.unit !== "pcs" ? ing.unit : ""}
              </span>
            </div>
          ))}
        </div>

        {/* Steps */}
        <h2 style={{ fontSize: 17, fontWeight: 700, color: "#3B1F0B", margin: "28px 0 12px" }}>Steps</h2>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {recipe.steps.map((step, i) => (
            <div key={i} onClick={() => toggleStep(i)} style={{
              padding: "14px 16px", background: checkedSteps[i] ? "#F0FDF4" : "#fff",
              borderRadius: 12, border: `1px solid ${checkedSteps[i] ? "#BBF7D0" : "#EDE8DF"}`,
              cursor: "pointer", transition: "all 0.2s",
            }}>
              <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                <div style={{
                  width: 24, height: 24, borderRadius: "50%", flexShrink: 0, marginTop: 1,
                  background: checkedSteps[i] ? "#16A34A" : "#E5E0D8",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  fontSize: 12, fontWeight: 700, color: checkedSteps[i] ? "#fff" : "#78716C",
                  transition: "all 0.2s",
                }}>
                  {checkedSteps[i] ? "✓" : i + 1}
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{
                    fontSize: 14, fontWeight: 700, color: "#3B1F0B", marginBottom: 4,
                    textDecoration: checkedSteps[i] ? "line-through" : "none",
                    opacity: checkedSteps[i] ? 0.5 : 1,
                  }}>
                    {step.title}
                  </div>
                  <div style={{
                    fontSize: 13, color: "#78716C", lineHeight: 1.5,
                    opacity: checkedSteps[i] ? 0.5 : 1,
                  }}>
                    {step.content}
                  </div>
                  {step.timerSeconds && !checkedSteps[i] && (
                    <div onClick={(e) => e.stopPropagation()}>
                      <Timer seconds={step.timerSeconds} />
                    </div>
                  )}
                </div>
              </div>
            </div>
          ))}
        </div>

        {/* Notes */}
        {recipe.notes && recipe.notes.length > 0 && (
          <>
            <h2 style={{ fontSize: 17, fontWeight: 700, color: "#3B1F0B", margin: "28px 0 12px" }}>
              Notes & Tips
            </h2>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {recipe.notes.map((note, i) => (
                <div key={i} style={{
                  background: "#FEF9EE", border: "1px solid #F5E6C8", borderRadius: 12,
                  overflow: "hidden",
                }}>
                  <button onClick={() => setExpandedNote(expandedNote === i ? null : i)} style={{
                    width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center",
                    padding: "12px 16px", background: "none", border: "none", cursor: "pointer",
                  }}>
                    <span style={{ fontSize: 14, fontWeight: 700, color: "#92400E" }}>💡 {note.label}</span>
                    <span style={{
                      fontSize: 16, color: "#92400E", transform: expandedNote === i ? "rotate(180deg)" : "rotate(0)",
                      transition: "transform 0.2s",
                    }}>▾</span>
                  </button>
                  {expandedNote === i && (
                    <div style={{ padding: "0 16px 14px", fontSize: 13, color: "#78716C", lineHeight: 1.6 }}>
                      {note.text}
                    </div>
                  )}
                </div>
              ))}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function RecipeCard({ recipe, onClick }) {

      borderRadius: 16, padding: "18px 20px", cursor: "pointer", transition: "all 0.2s",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
        <h3 style={{ fontSize: 16, fontWeight: 700, color: "#3B1F0B", margin: 0, flex: 1 }}>
          {recipe.title}
        </h3>
        {recipe.calories && (
          <span style={{
            fontSize: 11, fontWeight: 600, color: "#16A34A", background: "#F0FDF4",
            border: "1px solid #BBF7D0", padding: "3px 10px", borderRadius: 20, whiteSpace: "nowrap", marginLeft: 8,
          }}>
            {recipe.calories}
          </span>
        )}
      </div>
      <p style={{ fontSize: 13, color: "#78716C", margin: 0, lineHeight: 1.4 }}>
        {recipe.description}
      </p>
      <div style={{ display: "flex", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
        {recipe.tags.slice(0, 5).map((tag) => {
          const isWarm = tag.includes("warming");
          const isCool = tag.includes("cooling");
          const isBal = tag === "balanced" || tag === "tridoshic";
          return (
            <span key={tag} style={{
              fontSize: 11, fontWeight: 500, padding: "3px 10px", borderRadius: 20,
              background: isWarm ? "#FEF3C7" : isCool ? "#ECFDF5" : isBal ? "#EFF6FF" : "#F5F0E8",
              color: isWarm ? "#92400E" : isCool ? "#065F46" : isBal ? "#1E40AF" : "#78716C",
            }}>
              {tag}
            </span>
          );
        })}
      </div>
    </button>
  );
}

function CookbookApp() {
  const [recipes, setRecipes] = useState(DEFAULT_RECIPES);
  const [selectedId, setSelectedId] = useState(null);
  const [search, setSearch] = useState("");
  const [category, setCategory] = useState("all");
  const [drinkFilter, setDrinkFilter] = useState("all");
  const [loaded, setLoaded] = useState(false);

  // Load from storage
  useEffect(() => {
    (async () => {
      try {
        const result = { value: localStorage.getItem("cookbook-recipes") };
        if (result?.value) {
          const stored = JSON.parse(result.value);
          if (stored.length > 0) setRecipes(stored);
        }
      } catch (e) {
        // First time — use defaults
      }
      setLoaded(true);
    })();
  }, []);

  // Save to storage
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        localStorage.setItem("cookbook-recipes", JSON.stringify(recipes));
      } catch (e) {
        console.error("Save failed:", e);
      }
    })();
  }, [recipes, loaded]);

  const selectedRecipe = recipes.find((r) => r.id === selectedId);

  const filtered = recipes.filter((r) => {
    const q = search.toLowerCase();
    const matchesSearch = !q || r.title.toLowerCase().includes(q) ||
      r.tags.some((t) => t.toLowerCase().includes(q)) ||
      r.description.toLowerCase().includes(q);
    const matchesCategory = category === "all" || r.category === category;
    const matchesDrinkTime = category !== "drinks" || drinkFilter === "all" || r.drinkTime === drinkFilter;
    return matchesSearch && matchesCategory && matchesDrinkTime;
  });

  const categories = [
    { key: "all", label: "All", icon: "📖" },
    { key: "drinks", label: "Drinks", icon: "🍵" },
    { key: "food", label: "Food", icon: "🍽️" },
    { key: "desserts", label: "Desserts", icon: "🍫" },
  ];

  const drinkTimes = [
    { key: "all", label: "All" },
    { key: "morning", label: "☀️ Morning" },
    { key: "meals", label: "🍽️ With Meals" },
    { key: "bedtime", label: "🌙 Bedtime" },
    { key: "anytime", label: "✨ Anytime" },
  ];

  if (selectedRecipe) {
    return <RecipeDetail recipe={selectedRecipe} onBack={() => setSelectedId(null)} />;
  }

  return (
    <div style={{ minHeight: "100vh", background: "#FFFCF7" }}>
      {/* Header */}
      <div style={{
        background: "linear-gradient(145deg, #3B1F0B, #5C3317)",
        padding: "40px 20px 32px", textAlign: "center",
      }}>
        <div style={{ fontSize: 36, marginBottom: 6 }}>📖</div>
        <h1 style={{ color: "#fff", fontSize: 26, margin: "0 0 4px", fontWeight: 800, letterSpacing: -0.5 }}>
          Mehtab's Cookbook
        </h1>
        <p style={{ color: "rgba(255,255,255,0.6)", fontSize: 13, margin: 0 }}>
          {recipes.length} recipe{recipes.length !== 1 ? "s" : ""}
        </p>
      </div>

      <div style={{ padding: "16px 20px 60px" }}>
        {/* Search */}
        <div style={{ position: "relative", marginBottom: 20 }}>
          <input
            type="text"
            placeholder="Search recipes..."
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            style={{
              width: "100%", padding: "12px 16px 12px 40px", fontSize: 14,
              border: "1px solid #EDE8DF", borderRadius: 12, background: "#fff",
              outline: "none", boxSizing: "border-box", color: "#3B1F0B",
            }}
          />
          <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", fontSize: 16, opacity: 0.4 }}>
            🔍
          </span>
        </div>

        {/* Category Tabs */}
        <div style={{ display: "flex", gap: 8, marginBottom: 20, overflowX: "auto" }}>
          {categories.map((cat) => {
            const count = cat.key === "all" ? recipes.length : recipes.filter(r => r.category === cat.key).length;
            return (
              <button key={cat.key} onClick={() => { setCategory(cat.key); setDrinkFilter("all"); }} style={{
                display: "flex", alignItems: "center", gap: 6, padding: "8px 16px",
                borderRadius: 12, border: "none", cursor: "pointer", whiteSpace: "nowrap",
                fontSize: 13, fontWeight: 600, transition: "all 0.2s",
                background: category === cat.key ? "#3B1F0B" : "#fff",
                color: category === cat.key ? "#fff" : "#78716C",
                boxShadow: category === cat.key ? "none" : "0 1px 3px rgba(0,0,0,0.06)",
              }}>
                <span>{cat.icon}</span>
                <span>{cat.label}</span>
                <span style={{
                  fontSize: 11, padding: "1px 6px", borderRadius: 10,
                  background: category === cat.key ? "rgba(255,255,255,0.2)" : "#F5F0E8",
                  color: category === cat.key ? "rgba(255,255,255,0.8)" : "#A8A29E",
                }}>
                  {count}
                </span>
              </button>
            );
          })}
        </div>

        {/* Drink Time Sub-filters */}
        {category === "drinks" && (
          <div style={{ display: "flex", gap: 6, marginBottom: 20, overflowX: "auto" }}>
            {drinkTimes.map((dt) => (
              <button key={dt.key} onClick={() => setDrinkFilter(dt.key)} style={{
                padding: "6px 14px", borderRadius: 20, border: "1px solid",
                cursor: "pointer", whiteSpace: "nowrap", fontSize: 12, fontWeight: 600,
                transition: "all 0.2s",
                background: drinkFilter === dt.key ? "#5C3317" : "transparent",
                color: drinkFilter === dt.key ? "#fff" : "#78716C",
                borderColor: drinkFilter === dt.key ? "#5C3317" : "#EDE8DF",
              }}>
                {dt.label}
              </button>
            ))}
          </div>
        )}

        {/* Recipe List */}
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {filtered.map((r) => (
            <RecipeCard key={r.id} recipe={r} onClick={() => setSelectedId(r.id)} />
          ))}
          {filtered.length === 0 && (
            <p style={{ textAlign: "center", color: "#A8A29E", fontSize: 14, marginTop: 40 }}>
              No recipes found
            </p>
          )}
        </div>
      </div>
    </div>
  );
}
